spring:
  profiles:
    active: dev
  application:
    name: AI-Powered Smart Hospital Management System

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours (86400000 ms)

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
